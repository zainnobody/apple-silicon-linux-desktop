# Kernel settings that every agx kernel build sets and then checks after olddefconfig.
# From agx-linux-kit build/build-kernel.sh (the safe settings of docs/gpu-stack-review.md).
# Format: NAME=y | NAME=m | NAME=n | NAME="string". LOCALVERSION comes from AGX_LOCALVERSION.
EXPERT=y
SILICONFOREST_NATIVE_GPU=y
SILICONFOREST_M3=n
# Built in: the Rust gpuvm binding needs DRM_GPUVM=y. DRM_ASAHI_G15 needs APPLE_PMP=y.
DRM_ASAHI=y
APPLE_PMP=y
DRM_ASAHI_G15=y
DRM_GPUVM=y
# Livepatch fails a KSYM_NAME_LEN build check in this tree.
LIVEPATCH=n
# Touch ID (SEP) is in test boots only.
APPLE_SEP=n
ARM64_USER4K_EXPERIMENTAL=n
KUNIT=n
# pahole and BTF often break Rust builds.
DEBUG_INFO_BTF=n
# The distro's signing keys are not available to a local build.
SYSTEM_TRUSTED_KEYS=""
SYSTEM_REVOCATION_KEYS=""
MODULE_SIG_ALL=n
# Apple USB4 host router: without it the USB-C PD controllers stay in deferred probe.
USB4=y
USB4_APPLE_SOC=m
# A fixed release name (7.2.11-agx), with no "+" from the source tree state.
LOCALVERSION_AUTO=n
