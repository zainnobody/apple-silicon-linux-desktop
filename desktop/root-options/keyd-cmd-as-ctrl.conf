# DRAFT, NOT APPLIED. Needs root and a package: sudo dnf install keyd. Not tested on the M3.
# Goal: the Cmd key (Super_L on Linux) works like Ctrl for copy, paste, save and so on, as on a Mac.
# Install: copy to /etc/keyd/default.conf, then: sudo systemctl enable --now keyd
# Undo: sudo systemctl disable --now keyd && sudo rm /etc/keyd/default.conf
# Check with a physical keypress first. A wrong layer can lock out the keyboard. Keep an SSH session open while you test.
[ids]
*

[main]
# Hold Cmd to get a Ctrl layer
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[cmd:C]
# Keep these as the KDE shortcuts that use Meta: KRunner on Cmd+Space, app switch on Cmd+Tab.
space = M-space
tab = A-tab
