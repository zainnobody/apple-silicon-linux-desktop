# Draft, not applied, not tested. Needs root.
# Install as /etc/plasmalogin.conf.d/60-m3-flat.conf
# Effect: the Plasma Login Manager greeter shows one flat colour, the same colour as the lock screen.
# The greeter QML is compiled into /usr/libexec/plasma-login-greeter. This pack does not change it.
[Greeter]
WallpaperPlugin=org.kde.color

[Greeter][Wallpaper][org.kde.color][General]
Color=#0b3d91
